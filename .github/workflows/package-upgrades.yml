name: package upgrades

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: package-upgrades
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upgrade:
    name: upgrade packages
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: report .NET
        run: dotnet --version

      - name: provision cddl (RHPv2 wire-grammar conformance)
        run: |
          if command -v cddl >/dev/null 2>&1 || [ -x "$HOME/.cargo/bin/cddl" ]; then
            echo "cddl already provisioned"
            echo "PDN_REQUIRE_CDDL=1" >> "$GITHUB_ENV"
          elif command -v cargo >/dev/null 2>&1; then
            flock /tmp/pdn-ci-cddl-install.lock cargo install cddl --locked --version 0.10.7
            echo "PDN_REQUIRE_CDDL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::cargo is absent on this runner, so the RHPv2 CDDL conformance suite will report Skipped"
          fi

      - name: full upgrade, build and test
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump-packages.py Packet.NET.slnx | tee "$RUNNER_TEMP/upgrades.txt"
          for project in Packet.Agw.Tests Packet.Ax25.Properties Packet.Ax25.Tests Packet.Ax25.Radio.Tests Packet.Ax25.Radio.Tait.Tests Packet.Axudp.Tests Packet.Core.Tests Packet.Kiss.NinoTnc.Tests Packet.Kiss.Serial.Tests Packet.Kiss.Tests Packet.Mcp.Tests Packet.NetRom.Tests Packet.Node.Tests Packet.Rhp2.Tests Packet.Tune.Core.Tests; do
            flock -s /tmp/pdn-ci-heavy.lock \
            dotnet test tests/$project/$project.csproj \
              --configuration Release \
              --logger "trx;LogFileName=test-results.trx" \
              --filter "Category!=HardwareLoop&Category!=Interop"
          done

      - name: security fallback, build and test
        id: security
        if: steps.full.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx -e .dotnet
          python3 scripts/bump-packages.py Packet.NET.slnx --vulnerable-only | tee "$RUNNER_TEMP/upgrades.txt"
          for project in Packet.Agw.Tests Packet.Ax25.Properties Packet.Ax25.Tests Packet.Ax25.Radio.Tests Packet.Ax25.Radio.Tait.Tests Packet.Axudp.Tests Packet.Core.Tests Packet.Kiss.NinoTnc.Tests Packet.Kiss.Serial.Tests Packet.Kiss.Tests Packet.Mcp.Tests Packet.NetRom.Tests Packet.Node.Tests Packet.Rhp2.Tests Packet.Tune.Core.Tests; do
            flock -s /tmp/pdn-ci-heavy.lock \
            dotnet test tests/$project/$project.csproj \
              --configuration Release \
              --logger "trx;LogFileName=test-results.trx" \
              --filter "Category!=HardwareLoop&Category!=Interop"
          done

      - name: commit and push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "nothing to upgrade"
            exit 0
          fi
          if [ "${{ steps.full.outcome }}" = "failure" ]; then
            subject="chore(deps): security package fixes"
          else
            subject="chore(deps): package upgrades"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "$subject"
            echo
            echo "Built and tested before commit. Changed by scripts/bump-packages.py:"
            echo
            cat "$RUNNER_TEMP/upgrades.txt"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          git pull -q --rebase origin main
          git push origin HEAD:main
