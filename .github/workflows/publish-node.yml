name: publish-node

# Builds the pdn node-host Debian packages (amd64 / arm64 / armhf) and attaches
# them to a GitHub Release. Triggered by `node-v*` tags - distinct from the
# `lib-v*` tag that drives the NuGet library publish (publish-libs.yml).
#
# Self-hosted x64 only (no GitHub-hosted runners - see CLAUDE.md). The arm builds
# cross-publish from x64 via crossgen2 (ReadyToRun), so no arch-native runners or
# cross C-toolchain are needed; scripts/build-deb.sh does the publish + packaging.
#
# Single job, no Actions artifacts. The .debs are built, install-smoked, and
# attached to the Release all from one job's local working tree - they never touch
# the Actions artifact store. This is deliberate: the cross-job artifact hand-off
# this workflow used previously depended on the ~500 MB free-tier artifact-storage
# quota, whose usage GitHub recalculates only every 6-12 h, so a busy day of CI
# could leave the counter transiently over-quota and block the release upload even
# with retention-days:1 (observed twice - 2026-06-05, 2026-06-06). Keeping the
# .debs local removes that dependency entirely; the published .debs live on the
# Release. The build is already serial (crossgen2 R2R is memory-hungry - three
# concurrent cross-publishes OOM-kill it, exit 137), so collapsing the per-arch
# matrix into one sequential job costs no parallelism.

on:
  push:
    tags:
      - 'node-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the node-v prefix, e.g. 0.1.0'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # release-notes.sh walks the commit range since the previous node-v tag,
          # so this job needs the whole history and every tag, not a shallow clone.
          fetch-depth: 0

      # build-deb.sh builds the web UI (npm ci + vite build) before publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - id: v
        name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/node-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .debs + archives (amd64 / arm64 / armhf)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # Serial: crossgen2 (ReadyToRun) is memory-hungry; concurrent cross-publishes
        # OOM-kill it (arm64 is the heaviest). One arch at a time fits the shared host.
        #
        # build-deb.sh publishes the self-contained tree to artifacts/node/<rid> and packages
        # the .deb from it. We ALSO tar that same tree as the release's archive artifact - the
        # two things pdn distributes (operating/00-install.md): the .deb for Debian-ish boxes,
        # the archive for everyone else. The archive is an UNMANAGED install: nothing owns it,
        # so the node reports channel `unknown` and never offers an in-app update; the operator
        # unpacks the next one over it. It therefore carries the systemd unit + the annotated
        # config template alongside the binary, so a by-hand install has everything it needs.
        # tar.gz (not zst) so any minimal target (Pi/RaspiOS) can extract with no extra tool.
        run: |
          for rid in linux-x64 linux-arm64 linux-arm; do
            scripts/build-deb.sh "$rid" "$VERSION"
            case "$rid" in
              linux-x64)   arch=amd64 ;;
              linux-arm64) arch=arm64 ;;
              linux-arm)   arch=armhf ;;
            esac
            install -m 0644 packaging/packetnet.service "artifacts/node/$rid/packetnet.service.example"
            install -m 0644 packaging/packetnet.yaml    "artifacts/node/$rid/packetnet.yaml.example"
            tar -C "artifacts/node/$rid" -czf "artifacts/packetnet_${VERSION}_${arch}.tar.gz" .
          done

      - name: Install-smoke the amd64 .deb (Debian-stable + Ubuntu-LTS)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # Gate: a .deb that won't install cleanly must never reach the release.
        # Container-isolated, so nothing is installed onto the self-hosted runner.
        # amd64 only (native, no QEMU); arm64/armhf are a later docker/setup-qemu matrix.
        run: scripts/deb-install-smoke.sh "artifacts/packetnet_${VERSION}_amd64.deb"

      - name: Stage release assets under version-free names
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # The release assets deliberately carry NO version in their filenames:
        # `packetnet_<arch>.deb` and `packetnet_<arch>.tar.gz`. That is what makes a
        # permanent, copy-pasteable download URL possible -
        #
        #   https://github.com/<owner>/<repo>/releases/latest/download/packetnet_arm64.deb
        #
        # - because GitHub's /releases/latest/download/ redirect resolves an asset by exact
        # name, so any version in the name would change the URL every release. Nothing needs
        # the version in the filename: dpkg reads it from the package's own control metadata
        # (`dpkg -I packetnet_arm64.deb`), the release tag states it, and SHA256SUMS pins the
        # bytes. Local builds (scripts/build-deb.sh) keep the versioned Debian-convention name;
        # only the uploaded copies are renamed. Hard links, so this costs no extra disk.
        #
        # These are the ONLY .deb names a release carries. node-v0.44.0 also attached the older
        # `packetnet_<ver>_<arch>.deb` names so that nodes predating the rename - which build
        # that filename themselves rather than reading it off the release - could still
        # self-update; that transition was dropped deliberately (Tom, 2026-08-21). A node older
        # than node-v0.44.0 therefore finds no asset it recognises and reports no update
        # available; it needs one manual install to get current, after which self-update works
        # again. Do not reintroduce a second name here without also restoring the fallback in
        # GithubUpdateRequestBuilder.
        run: |
          rm -rf artifacts/release
          mkdir -p artifacts/release
          for arch in amd64 arm64 armhf; do
            ln "artifacts/packetnet_${VERSION}_${arch}.deb"    "artifacts/release/packetnet_${arch}.deb"
            ln "artifacts/packetnet_${VERSION}_${arch}.tar.gz" "artifacts/release/packetnet_${arch}.tar.gz"
          done

      - name: Generate release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # Bullet-point change notes from the commit range since the previous
        # node-v tag, plus a one-line pointer at the install docs. The description
        # of a release should say what moved; install instructions live in the
        # operating guide, and repeating them here made every release read the same.
        run: |
          scripts/release-notes.sh \
            --series node \
            --version "$VERSION" \
            --repo "${{ github.repository }}" > release-notes.md
          cat release-notes.md

      - name: Checksum + create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        # The GitHub Release is the ONLY distribution channel: three .debs, three archives,
        # and SHA256SUMS over all of them. (There is no update feed and no one-line installer -
        # both were withdrawn; the node updates a .deb install through dpkg/apt, and an
        # archive install is updated by hand.)
        #
        # --latest is explicit, not incidental. This repo cuts more than one release series
        # (`headend-v*` alongside `node-v*`), and /releases/latest/download/ serves whichever
        # single release currently holds the "Latest" pointer - by default the newest one, of
        # any series. So the static node URL is only stable if node releases claim that pointer
        # and the others decline it: publish-headend.yml passes --latest=false for exactly this
        # reason. Without that pairing, cutting a head-end release would 404 every documented
        # packetnet_<arch>.deb link until the next node release. Any future release series added
        # to this repo must pass --latest=false too.
        run: |
          cd artifacts/release
          sha256sum packetnet_* > SHA256SUMS
          ls -l
          cd ../..
          gh release create "node-v${VERSION}" \
            artifacts/release/* \
            --repo "${{ github.repository }}" \
            --latest \
            --title "pdn node-v${VERSION}" \
            --notes-file release-notes.md
