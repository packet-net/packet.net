name: ci

# main-only by design (2026-07-14): PRs merge on green LOCAL test runs (the working
# pattern), so PR-triggered CI just doubled every slice's runner load — the push-to-main
# run is the CI signal. Use workflow_dispatch for an on-demand branch run.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GitHub will force JavaScript actions onto Node.js 24 from
  # June 2nd, 2026 and remove Node.js 20 from the runner on
  # September 16th, 2026. Opting in early both silences the
  # deprecation warning and lets us catch any Node 24 breakage
  # well ahead of the forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.project }})
    runs-on: [self-hosted, Linux, X64]
    # Self-hosted Linux runners — zero GitHub Actions minutes consumed.
    strategy:
      fail-fast: false
      # 4 org-level runners (packet-net runner-1..4) on the same physical host.
      # Cap at 4 so this workflow never monopolises all runners, and because
      # the per-runner flock below coordinates across runner processes via /tmp —
      # the exclusive heavy workflows (interop / fuzz / deb-smoke) hold an
      # EXCLUSIVE flock that starves the real-time AX.25 pumps in
      # Packet.Node.Tests if they overlap. 20 matrix legs × max-parallel 4
      # naturally saturates all four runners, so throughput is unchanged.
      max-parallel: 4
      # KEEP IN SYNC WITH tests/: the `test-matrix-guard` job below fails the build
      # if a tests/*/*.csproj is missing here (or listed here but gone from disk).
      # Packet.Interop.Tests is deliberately absent; see that job's exclusion list.
      matrix:
        project:
          - Packet.Agw.Tests
          - Packet.Aprs.Tests
          - Packet.Ax25.Properties
          - Packet.Ax25.Tests
          - Packet.Axudp.Tests
          - Packet.Core.Tests
          - Packet.Kiss.NinoTnc.Tests
          - Packet.Kiss.Serial.Tests
          - Packet.Kiss.Tests
          - Packet.Mcp.Tests
          - Packet.NetRom.Tests
          - Packet.Node.Tests
          - Packet.Radio.Tait.Tests
          - Packet.Radio.Tests
          - Packet.Rhp2.Tests
          - Packet.Rig.Flrig.Tests
          - Packet.Rig.Hamlib.Tests
          - Packet.Rig.Tests
          - Packet.Tune.Core.Tests
    steps:
      - uses: actions/checkout@v6

      - name: report .NET
        run: dotnet --version

      - name: provision cddl (RHPv2 wire-grammar conformance)
        if: matrix.project == 'Packet.Rhp2.Tests'
        # tests/Packet.Rhp2.Tests/CddlWireConformanceTests.cs validates every RHPv2 JSON
        # payload against spec/rhp2.cddl with the `cddl` CLI. No runner had the binary, and
        # the suite used to `return` silently when it was missing: 33 tests reported Passed
        # having verified nothing (#700 C028). They now report Skipped when it is absent, and
        # PDN_REQUIRE_CDDL=1 on the test step below turns "absent on CI" into a red build.
        # `cargo install` is a one-off per runner (a few minutes of rustc); every later run is
        # the PATH check. The flock keeps two concurrent workflow runs off the same cargo
        # target dir. A runner without cargo cannot provision it: that is a loud warning and
        # the suite reports Skipped, never a false Pass. A cargo that fails to build it is a
        # red build, because that is a real breakage rather than a missing prerequisite.
        run: |
          if command -v cddl >/dev/null 2>&1 || [ -x "$HOME/.cargo/bin/cddl" ]; then
            echo "cddl already provisioned"
            echo "PDN_REQUIRE_CDDL=1" >> "$GITHUB_ENV"
          elif command -v cargo >/dev/null 2>&1; then
            # Pinned: the suite passes the global `--ci` flag, without which `cddl validate`
            # exits 0 even when validation FAILS, which is how the suite managed to be vacuous
            # a second way. Bump deliberately, after checking that flag still exists.
            flock /tmp/pdn-ci-cddl-install.lock cargo install cddl --locked --version 0.10.7
            echo "PDN_REQUIRE_CDDL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::cargo is absent on this runner, so the RHPv2 CDDL conformance suite will report Skipped; install rustup on the runner to close the gap"
          fi

      - name: test
        # PDN_REQUIRE_CDDL comes from the provisioning step above (Rhp2 leg only): with the
        # tool present the CDDL suite must run, so a later disappearance fails the build
        # instead of silently skipping.
        # Shared (reader) box-wide flock. The 4 org-level runners are separate
        # processes on the same LXC host, sharing /tmp, so this lock coordinates
        # across all of them. Multiple shared holders coexist (4 test legs run
        # truly in parallel) but never overlap a CPU-heavy EXCLUSIVE workflow —
        # interop / fuzz / deb-smoke. That overlap oversubscribes the physical CPU
        # and starves the real-time AX.25 pumps/timers (the Packet.Node.Tests
        # flake). Command-wrapped so the lock releases on process exit.
        # See docs/plan.md §7.2.2.
        run: |
          flock -s /tmp/pdn-ci-heavy.lock \
          dotnet test tests/${{ matrix.project }}/${{ matrix.project }}.csproj \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --filter "Category!=HardwareLoop&Category!=Interop"

      - name: upload test results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}
          path: 'tests/${{ matrix.project }}/TestResults/*.trx'
          # Short retention: these only upload on failure and are for immediate
          # triage; long retention just accumulates against the ~500 MB Actions
          # artifact quota (the same one that bit publish-node — see its header).
          retention-days: 1

  guards:
    name: guards
    runs-on: [self-hosted, Linux, X64]
    # Cheap repo-invariant checks that keep review findings from recurring. Seconds, no
    # build, no flock needed, but a real gate: each one here is a bug that already
    # happened once (packet.net#699).
    steps:
      - uses: actions/checkout@v6

      - name: ci.yml test matrix covers every test project
        # C017: three Packet.Rig* test projects (103 tests) were never run by any workflow
        # because the matrix is hand-listed and nobody updated it.
        run: scripts/check-ci-test-matrix.sh

      - name: packaging update-helper URL guards
        # C075: the github self-update helper's "GitHub only" gate globbed the whole URL, so
        # https://evil.example/x.github.com/p.deb passed it, and that helper runs as root.
        run: scripts/github-update-url-test.sh

      - name: doc links resolve
        # C107: the 2026-05-17 repo split and the config-in-DB move left links to files
        # that had moved to a sibling repo or been deleted, and nothing noticed for months.
        run: scripts/check-doc-links.sh

      - name: operator-facing output is plain ASCII
        # #738 item 3: an em dash or a U+2192 in a log template renders as <E2><80><94> in
        # journalctl (its pager runs under a C locale). WP8's C066 swept them out by hand and
        # nothing held the line - three had come back by the GB7RDG upgrade rehearsal, one on
        # the config-schema migration line every upgrade prints.
        run: scripts/check-ascii-log-output.sh

      - name: no Flaky-traited test runs unfiltered
        # C110: the repo's one [Trait("Category","Flaky")] test ran on every push, because the
        # test filter excludes only HardwareLoop and Interop, so the trait meant nothing and a
        # known-unreliable test kept gating main. That test is now deterministic and the trait
        # is gone. If a Flaky trait ever comes back, either it gets fixed or the filter has to
        # exclude it; this guard forces that choice instead of letting it lurk.
        run: |
          if grep -rn '"Flaky"' tests --include=*.cs; then
            if ! grep -q 'Category!=Flaky' .github/workflows/ci.yml; then
              echo "::error::a test is traited Flaky but ci.yml's test filter does not exclude it"
              exit 1
            fi
          fi
          echo "ok: no Flaky-traited test runs unfiltered"

      - name: no node_modules is git-tracked
        # C102: web/ax25/node_modules (3058 files, 19 MB) stayed tracked long after the
        # directory it belonged to was extracted to packet-net/ax25-ts.
        run: |
          if git ls-files | grep -qE '(^|/)node_modules/'; then
            echo "::error::node_modules is git-tracked; see .gitignore"
            git ls-files | grep -E '(^|/)node_modules/' | head -20
            exit 1
          fi
          echo "ok: nothing under node_modules/ is tracked"

  web-ui:
    name: web-ui
    runs-on: [self-hosted, Linux, X64]
    # The Phase-5 node control-panel SPA (web/packetnet-ui): type-check + production
    # build + the screen smoke tests — the gate that keeps the served UI from
    # regressing. Self-hosted Linux runner, zero GitHub Actions minutes.
    defaults:
      run:
        working-directory: web/packetnet-ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: report node
        run: node --version && npm --version

      - name: install
        run: npm ci

      - name: lint + typecheck + build + test
        # `npm run lint` is eslint over the whole SPA with --max-warnings 0; it went
        # years without a config file, so the script could only fail and CI never ran
        # it (#691 C009) - which is how react-hooks disables piled up against a rule
        # nothing enforced, and how screens came to import the mock fixtures. The
        # no-restricted-imports rule in eslint.config.js is the gate that keeps them
        # out. `npm run build` is `tsc --noEmit && vite build`; then the vitest screen
        # smoke suite. Shared (reader) box-wide flock, same discipline as the .NET
        # test job: coexist with other readers across all 4 org runners, never
        # overlap a CPU-heavy EXCLUSIVE workflow (interop / fuzz / deb-smoke).
        run: flock -s /tmp/pdn-ci-heavy.lock bash -c 'npm run lint && npm run build && npm run test'

  dependency-scan:
    name: dependency-scan
    runs-on: [self-hosted, Linux, X64]
    # Fails the build if any referenced NuGet package (direct OR transitive) has a
    # known advisory in the configured sources — the supply-chain tripwire. Cheap
    # (`dotnet list package --vulnerable` is a restore + a metadata query), self-
    # hosted, zero GitHub Actions minutes. If a flagged transitive dep ever has no
    # fixable upgrade, pin the override in Directory.Packages.props (CPM) or relax
    # this gate deliberately — don't let it rot into an ignored red.
    steps:
      - uses: actions/checkout@v6

      - name: report .NET
        run: dotnet --version

      - name: vulnerable-package scan
        # `dotnet list package --vulnerable` always exits 0, so detect findings by
        # the table's row marker (lines like "   > Package  1.0  1.0  High  url").
        # Shared (reader) flock — a restore + metadata query is light, but keep the
        # box-wide discipline so it never overlaps an EXCLUSIVE heavy workflow.
        run: |
          flock -s /tmp/pdn-ci-heavy.lock bash -c '
            dotnet restore Packet.NET.slnx
            dotnet list Packet.NET.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
            # GHSA-2m69-gcr7-jv3q is a SQLite-native advisory on the transitive
            # SQLitePCLRaw.lib.e_sqlite3 (via Microsoft.Data.Sqlite) with NO published fixed
            # version — also NuGetAuditSuppress-ed in Directory.Build.props. dotnet list does
            # not honour that suppression, so ignore this one advisory here too; remove when a
            # patched bundle ships. ANY OTHER vulnerable package still fails the gate.
            if grep -E "^[[:space:]]*>[[:space:]]" vuln.txt | grep -vq "GHSA-2m69-gcr7-jv3q"; then
              echo "::error::Vulnerable NuGet packages detected (see the scan output above)."
              exit 1
            fi
            echo "No blocking vulnerable packages."
          '

      - name: upload scan output
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-output
          path: vuln.txt
          retention-days: 7
