; ===========================================================================
; One of three LinBPQ AXIP peers for the multipoint-AXUDP interop test
; (tests/Packet.Interop.Tests/Linbpq/NetRomMultipointAxudpThreePeers.cs).
;
; Mirrors how GB7RDG's real AXIP partners are set up: each peer listens on ONE
; UDP port and MAPs the pdn node (PNMPX, SSID-less, so every PNMPX-n matches)
; at that SAME port number on the host, with the B (broadcast) flag, plus
; BROADCAST NODES and BROADCAST ID. pdn runs one axudp-multipoint port per UDP
; port (8197 / 8198 / 8199), each with this peer as its only (broadcast) peer.
; 172.30.0.1 is the rfnet bridge gateway = the host, where the test's pdn binds.
;
; QUALITY=50 / MINQUAL=20 are GB7RDG's AXIP values. LOCATOR=NONE keeps these
; test nodes off the public BPQ node map.
; ===========================================================================
SIMPLE=1
NODECALL=PN1MPC
NODEALIAS=MPC
LOCATOR=NONE
NODESINTERVAL=1
IDINTERVAL=1
MINQUAL=10

IDMSG:
PN1MPC multipoint AXUDP interop peer
***
CTEXT:
PN1MPC multipoint AXUDP interop peer
***

PORT
 PORTNUM=1
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 MAXSESSIONS=10
 USER=admin,admin,PN1MPC,,SYSOP
ENDPORT

PORT
 PORTNUM=2
 ID=AXIP
 DRIVER=BPQAXIP
 QUALITY=50
 MINQUAL=20
 MAXFRAME=7
 FRACK=7000
 RESPTIME=1000
 RETRIES=10
 CONFIG
 UDP 8199
 MHEARD ON
 BROADCAST NODES
 BROADCAST ID
 MAP PNMPX 172.30.0.1 UDP 8199 B
ENDPORT
