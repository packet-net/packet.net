# pdn node - container default config, FIRST-BOOT SEED (baked into the
# ghcr.io/packet-net/packet.net image).
#
# This is not the container's live config. The node imports it into `pdn.db` on its
# first start - in the image that is the `pdn-state` volume - and never reads it again
# (docs/config-in-db.md). So editing it in the /etc/packetnet volume, or bind-mounting
# your own over it, only takes effect on a node whose state volume is still empty.
# After that: the control panel, `PUT /api/v1/config[/raw]`, or `pdn config import`.
#
# It differs from the .deb's template in what a container needs rather than in posture:
# telnet is off (nothing publishes 8011), and the commented examples are dropped. Both
# templates bind the HTTP panel on 0.0.0.0 with auth ON, so the panel is reachable
# wherever `docker run -p` publishes it and a login is what stands between the network
# and a session that can rewrite config, add ports, and transmit. Seed your real
# callsign and ports below before the first start.
schemaVersion: 2

identity:
  callsign: N0CALL          # CHANGE THIS - your licensed callsign
  alias: PDN

ports: []                   # add your KISS-TCP / serial / AXUDP ports here

management:
  telnet:
    enabled: false
  http:
    bind: 0.0.0.0           # container: reachable via -p (see the header)
    port: 8080
  auth:
    enabled: true           # first run lands on the setup wizard (never gated at zero
                            # users); everything after that needs a login.
