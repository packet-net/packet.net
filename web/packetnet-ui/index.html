<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Control panel, not a document: lock zoom (no pinch / double-tap / input-focus
         zoom) so it behaves like an app on mobile. viewport-fit=cover handles notches. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>pdn — node control</title>
    <!-- No external stylesheet, and nothing else off-box: this panel is served by a node
         that may have no route to the internet at all. Inter + JetBrains Mono are
         self-hosted (@font-face in src/index.css, files in public/fonts). #691 C051. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
