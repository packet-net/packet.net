# pdn app catalog — the curated index of "Available apps" (docs/app-catalog.md).
#
# This file is committed here and baked into the node .deb at
# /usr/share/packetnet/catalog/apps.yaml. pdn reads it to populate the control
# panel's "Available apps" view; the owner installs an app from the browser and
# pdn fetches + sha256-verifies the artifact, staging a discovered-but-DISABLED
# package into /var/lib/packetnet/apps/<id>/ (enable stays the separate grant).
#
# TRUST: every artifact is pinned by sha256 (GitHub's recorded per-asset digest).
# A mismatched hash is a hard refusal — never a staged file. "Vetted" means we
# chose the version + the hash, exactly like the old build-deb.sh DAPPS pins.
#
# TO BUMP an app to its latest release: run `scripts/regen-catalog.sh` (or
# `scripts/regen-catalog.sh --app <id>` for one). It pulls each asset's recorded
# sha256 digest + url from the latest GitHub release and rewrites version/url/
# sha256 in place, preserving these comments. `--check` is the drift guard;
# `--print` prints the block to paste. See docs/app-catalog.md § Catalog
# maintenance. To ADD a new app, hand-write its entry (name/description/icon/
# capabilities/homepage + an artifact stub) once, then let regen fill the pins.
#
# CAPABILITIES: free-form strings shown to the owner as the install/enable trust
# prompt (not enforced in v1). Conventional values: `session`, `packet`, `web`.
# `packet` means full packet-radio network access — the app binds a callsign and
# sends/receives over AX.25/NET-ROM (RF/KISS-TCP/AXUDP/sim). It replaces the old
# `network` spelling, which read as TCP/IP/LAN. pdn still ACCEPTS `network` as a
# back-compat alias and display-normalises it to `packet` (AppCapabilities.Normalize),
# so a third-party app whose manifest still says `network` is shown as `packet`.

catalog: 1

apps:
